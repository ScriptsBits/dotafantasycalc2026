<!doctype html>
<html><head><meta charset="utf-8">
<title>The Wonder Cow TI 2026 Calculator | UPDATED FOR MAIN EVENT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* ============================================================ tokens */
:root{
  color-scheme: light;
  --ground:#DCE0E0; --surface:#F1F4F3; --sunk:#CBD2D1; --raised:#FFFFFF;
  --ink:#10161A; --ink2:#3D474C; --muted:#6B767B;
  --rule:#C0C9C8; --rule2:#A6B1B0;
  --brass:#8A6316; --brass2:#6B4C10; --brass-soft:rgba(138,99,22,.13);
  --red:#B0432C; --blue:#2A6099; --green:#1F7A52;
  --red-soft:rgba(176,67,44,.14); --blue-soft:rgba(42,96,153,.14); --green-soft:rgba(31,122,82,.14);
  --good:#1F7A52; --warn:#8A6316; --bad:#B0432C;
  --r0:#F0F2EF; --r1:#E4E2D0; --r2:#D8CDA9; --r3:#C9B87F; --r4:#B79E55; --r5:#987E31; --r6:#75601A;
  --shadow:0 1px 2px rgba(16,22,26,.06), 0 14px 34px -26px rgba(16,22,26,.5);
  --display:"Bahnschrift","Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0C1012; --surface:#141A1C; --sunk:#1C2426; --raised:#1E2628;
    --ink:#E6ECEA; --ink2:#AFB9B7; --muted:#7B8688;
    --rule:#232C2E; --rule2:#364143;
    --brass:#D6AC5C; --brass2:#E8C685; --brass-soft:rgba(214,172,92,.15);
    --red:#E0795C; --blue:#6FA3DC; --green:#4FBE8B;
    --red-soft:rgba(224,121,92,.16); --blue-soft:rgba(111,163,220,.16); --green-soft:rgba(79,190,139,.16);
    --good:#4FBE8B; --warn:#D6AC5C; --bad:#E0795C;
    --r0:#12191B; --r1:#1E2418; --r2:#2C321A; --r3:#42431E; --r4:#5D5726; --r5:#867236; --r6:#C09A4E;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 38px -28px rgba(0,0,0,1);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0C1012; --surface:#141A1C; --sunk:#1C2426; --raised:#1E2628;
  --ink:#E6ECEA; --ink2:#AFB9B7; --muted:#7B8688;
  --rule:#232C2E; --rule2:#364143;
  --brass:#D6AC5C; --brass2:#E8C685; --brass-soft:rgba(214,172,92,.15);
  --red:#E0795C; --blue:#6FA3DC; --green:#4FBE8B;
  --red-soft:rgba(224,121,92,.16); --blue-soft:rgba(111,163,220,.16); --green-soft:rgba(79,190,139,.16);
  --good:#4FBE8B; --warn:#D6AC5C; --bad:#E0795C;
  --r0:#12191B; --r1:#1E2418; --r2:#2C321A; --r3:#42431E; --r4:#5D5726; --r5:#867236; --r6:#C09A4E;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 16px 38px -28px rgba(0,0,0,1);
}

/* ============================================================ base */
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:16.5px; line-height:1.66;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding:0 clamp(16px,3.5vw,40px) 100px}
p{margin:0 0 1.05em; max-width:66ch}
strong{font-weight:650; color:var(--ink)}
em{font-style:italic}
a{color:var(--brass); text-underline-offset:2px}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px}
.tnum{font-variant-numeric:tabular-nums}

.lab{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
     color:var(--muted); font-weight:600}

/* ============================================================ masthead */
header.top{padding:clamp(38px,6vw,74px) 0 26px; border-bottom:3px solid var(--ink)}
.slate{display:flex; gap:10px 22px; flex-wrap:wrap; align-items:baseline; margin-bottom:22px}
.slate .badge{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
  font-weight:700; color:var(--ground); background:var(--ink); padding:4px 9px; border-radius:2px}
h1{font-family:var(--display); font-weight:700; font-size:clamp(36px,7vw,72px); line-height:.98;
   letter-spacing:-.015em; margin:0 0 18px; max-width:16ch; text-wrap:balance}
h1 span{color:var(--brass)}
.deck{font-size:clamp(17px,2vw,20.5px); line-height:1.55; color:var(--ink2); max-width:58ch; margin:0 0 30px}
.runsheet{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:1px;
  background:var(--rule); border:1px solid var(--rule)}
.runsheet div{background:var(--surface); padding:13px 15px}
.runsheet .k{font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
.runsheet .v{font-family:var(--display); font-size:1.45rem; line-height:1.2; margin-top:4px; letter-spacing:-.01em}
.runsheet .s{font-size:12px; color:var(--muted); line-height:1.45; margin-top:2px}

/* ============================================================ segments */
.seg{display:grid; grid-template-columns:154px minmax(0,1fr); gap:0 34px;
     border-top:1px solid var(--rule); padding:44px 0 8px}
.seg:first-of-type{border-top:0}
.cue{position:sticky; top:16px; align-self:start}
.cue .n{font-family:var(--display); font-size:3.2rem; line-height:.85; color:var(--brass); letter-spacing:-.03em}
.cue .t{font-family:var(--mono); font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
        color:var(--ink2); font-weight:700; margin-top:9px; line-height:1.5}
.cue .d{font-family:var(--mono); font-size:10.5px; color:var(--muted); line-height:1.6; margin-top:11px;
        padding-top:11px; border-top:1px solid var(--rule)}
h2{font-family:var(--display); font-weight:700; font-size:clamp(25px,3.4vw,37px); line-height:1.1;
   letter-spacing:-.015em; margin:0 0 16px; max-width:26ch; text-wrap:balance}
h3{font-family:var(--display); font-size:1.28rem; line-height:1.25; letter-spacing:-.005em;
   margin:34px 0 10px; color:var(--ink)}
h4{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
   color:var(--muted); font-weight:700; margin:26px 0 8px}
.lede{font-size:1.06rem; color:var(--ink2); max-width:62ch}

ul.pts{max-width:66ch; margin:0 0 16px; padding-left:0; list-style:none; display:grid; gap:11px}
ul.pts li{position:relative; padding-left:23px}
ul.pts li::before{content:""; position:absolute; left:0; top:.66em; width:13px; height:2px; background:var(--brass)}
ul.pts li.no::before{background:var(--bad)}
ul.pts li.yes::before{background:var(--good)}

.say{border-left:3px solid var(--rule2); padding:2px 0 2px 18px; margin:20px 0; max-width:64ch}
.say p:last-child{margin-bottom:0}
.note{background:var(--surface); border:1px solid var(--rule); border-left:3px solid var(--brass);
      padding:16px 20px; margin:22px 0; max-width:68ch; border-radius:0 3px 3px 0}
.note .h{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
         color:var(--brass); font-weight:700; margin-bottom:7px}
.note p:last-child{margin-bottom:0}
.note.warnb{border-left-color:var(--bad)} .note.warnb .h{color:var(--bad)}
.note.okb{border-left-color:var(--good)} .note.okb .h{color:var(--good)}

/* ============================================================ figures */
figure{margin:28px 0 6px; background:var(--surface); border:1px solid var(--rule);
       border-radius:3px; overflow:hidden; box-shadow:var(--shadow)}
figure.full{grid-column:1 / -1}
figcaption{padding:14px 20px; border-bottom:1px solid var(--rule); display:flex; gap:8px 16px;
           align-items:baseline; flex-wrap:wrap; background:var(--sunk)}
figcaption .fn{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.14em;
               text-transform:uppercase; color:var(--brass); white-space:nowrap}
figcaption .ft{font-family:var(--display); font-size:1.02rem; letter-spacing:-.005em; color:var(--ink)}
figcaption .fd{font-size:13.5px; color:var(--ink2); flex:1 1 240px; min-width:0}
.fbody{padding:20px; overflow-x:auto}
.fnote{font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.65;
       padding:0 20px 16px; max-width:none}

/* ============================================================ tables */
table.dt{border-collapse:collapse; width:100%; font-size:13.5px; min-width:440px;
         font-variant-numeric:tabular-nums}
table.dt th{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); font-weight:700; text-align:right; padding:0 12px 9px 0;
  border-bottom:1px solid var(--rule2); white-space:nowrap; vertical-align:bottom}
table.dt th:first-child, table.dt td:first-child{text-align:left}
table.dt td{padding:8px 12px 8px 0; border-bottom:1px solid var(--rule); text-align:right;
            white-space:nowrap; color:var(--ink2)}
table.dt td:first-child{color:var(--ink)}
table.dt tbody tr:last-child td{border-bottom:0}
table.dt tbody tr:hover{background:var(--sunk)}
table.dt td.n{font-family:var(--mono); font-size:12.5px}
tr.hl td{background:var(--brass-soft); font-weight:650; color:var(--ink)}
tr.mute td{color:var(--muted)}
.dot{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:7px; vertical-align:-1px}
.d-Red{background:var(--red)} .d-Blue{background:var(--blue)} .d-Green{background:var(--green)}
.tag{display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; font-weight:700;
     padding:2px 6px; border-radius:9px; border:1px solid currentColor; text-transform:uppercase}
.tag.g{color:var(--good)} .tag.w{color:var(--warn)} .tag.b{color:var(--bad)}

/* ============================================================ role panels */
.rolepanel{display:grid; grid-template-columns:minmax(0,1.85fr) minmax(228px,1fr);
  gap:12px 26px; align-items:start; padding:20px 0; border-top:1px solid var(--rule)}
.rolepanel:first-child{border-top:0; padding-top:2px}
@media(max-width:860px){.rolepanel{grid-template-columns:1fr}}
.rolepanel .ph{grid-column:1 / -1; display:flex; align-items:baseline; gap:11px; flex-wrap:wrap}
.rolepanel .ph b{font-family:var(--display); font-size:1.24rem; letter-spacing:-.01em; font-weight:700}
.rolepanel .ph span{font-family:var(--mono); font-size:9.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--muted); font-weight:600}
.rolepanel .chart{min-width:0}
.rolepanel table.dt{min-width:0; font-size:12px}
.rolepanel table.dt th{padding:0 8px 7px 0}
.rolepanel table.dt td{padding:5px 8px 5px 0}
td.q{font-family:var(--mono); font-size:11px; text-align:left; white-space:nowrap}
table.dt th.l, table.dt td.l{text-align:left}

/* ============================================================ bar rows */
.rows{display:grid; gap:4px; min-width:480px}
.brow{display:grid; grid-template-columns:168px 1fr 64px; gap:12px; align-items:center; height:21px}
.brow .bn{font-family:var(--mono); font-size:11px; color:var(--ink2); text-align:right;
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brow .bn.pick{color:var(--ink); font-weight:700}
.btrack{position:relative; height:14px; background:var(--sunk); border-radius:2px}
.bfill{position:absolute; top:0; bottom:0; border-radius:2px; min-width:2px}
.bzero{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--rule2)}
.brow .bv{font-family:var(--mono); font-size:11px; text-align:right; color:var(--ink)}
.axrow{display:grid; grid-template-columns:168px 1fr 64px; gap:12px; margin-top:7px;
       font-family:var(--mono); font-size:10px; color:var(--muted)}
.axin{display:flex; justify-content:space-between}

/* ============================================================ heat map */
.hm{border-collapse:separate; border-spacing:2px; font-family:var(--mono); font-size:10px; min-width:640px}
.hm th{font-weight:500; color:var(--muted); padding:0 3px}
.hm th.rot{height:104px; vertical-align:bottom}
.hm th.rot span{display:block; writing-mode:vertical-rl; transform:rotate(180deg); text-align:left; padding-bottom:5px}
.hm th.tm{text-align:right; color:var(--ink2); padding-right:9px; white-space:nowrap}
.hm td{width:30px; height:22px; border-radius:2px; text-align:center; color:var(--ink); cursor:default}
.hm td.top{box-shadow:inset 0 0 0 2px var(--ink)}

/* ---- team x prefix grids (Fig 24) */
.pfxblock{margin:0 0 26px}
.pfxblock:last-of-type{margin-bottom:6px}
.pfxhead{display:flex; align-items:baseline; gap:8px 14px; flex-wrap:wrap; margin:0 0 8px}
.pfxhead b{font-family:var(--display); font-size:1.1rem; letter-spacing:-.01em}
.pfxhead span{font-family:var(--mono); font-size:10px; letter-spacing:.12em;
              text-transform:uppercase; color:var(--muted); font-weight:600}
table.pfx{border-collapse:separate; border-spacing:2px; font-family:var(--mono);
          font-size:11px; min-width:790px; width:100%}
table.pfx th{font-weight:500; color:var(--muted); padding:0 3px 6px; line-height:1.3}
table.pfx th.p{width:70px; text-align:center; white-space:nowrap}
table.pfx th.p b{display:block; color:var(--ink2); font-weight:700; font-size:10.5px}
table.pfx th.tm{text-align:right; color:var(--ink2); padding:0 9px 0 0; white-space:nowrap;
                font-weight:500}
table.pfx td{height:23px; border-radius:2px; text-align:center; color:var(--ink);
             cursor:default; font-variant-numeric:tabular-nums}
table.pfx td.best{box-shadow:inset 0 0 0 2px var(--ink); font-weight:700}
table.pfx tr.avg th{color:var(--muted); padding-top:5px}
table.pfx tr.avg td{background:transparent !important; color:var(--muted); padding-top:5px}
.legend{display:flex; gap:8px 18px; flex-wrap:wrap; align-items:center; font-family:var(--mono);
        font-size:10.5px; color:var(--ink2); padding:0 20px 14px}
.legend i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px}

/* ============================================================ svg */
.chart{width:100%; display:block; overflow:visible}
.chart text{font-family:var(--mono); fill:var(--muted); font-size:10.5px}
.chart text.lb{fill:var(--ink2); font-size:11px}
.chart .gl{stroke:var(--rule); stroke-width:1}
.chart .ax{stroke:var(--rule2); stroke-width:1}

/* ============================================================ calculator */
.calc{display:grid; gap:16px}
.banks{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
@media(max-width:900px){.banks{grid-template-columns:1fr}}
.bank{background:var(--raised); border:1px solid var(--rule); border-radius:3px; padding:14px 15px 13px}
.bank h5{font-family:var(--display); font-size:1.1rem; margin:0 0 3px; letter-spacing:-.01em}
.bank .comp{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--muted);
            text-transform:uppercase; margin-bottom:12px}
.fld{display:flex; flex-direction:column; gap:5px; margin-bottom:11px}
.fld > span{font-family:var(--mono); font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--muted); font-weight:600}
select, input[type=number]{font-family:var(--mono); font-size:12.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--rule2); border-radius:2px; padding:7px 8px; width:100%}
input[type=number]{text-align:right; font-variant-numeric:tabular-nums}
.srow{display:grid; grid-template-columns:14px 1fr 76px; gap:8px; align-items:center; margin-bottom:7px}
.srow .chip{width:12px; height:12px; border-radius:2px}
.bank .sub{font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:11px;
           padding-top:10px; border-top:1px solid var(--rule); line-height:1.7}
.bank .sub b{color:var(--ink); font-weight:700}

.readout{display:grid; grid-template-columns:minmax(240px,1fr) minmax(300px,2fr); gap:16px;
         background:var(--raised); border:1px solid var(--rule); border-radius:3px; padding:18px 20px}
@media(max-width:820px){.readout{grid-template-columns:1fr}}
.bigp{font-family:var(--display); font-size:4.6rem; line-height:.9; letter-spacing:-.03em; color:var(--brass);
      font-variant-numeric:tabular-nums}
.bigp small{font-size:1.6rem; letter-spacing:0}
.pmeta{font-family:var(--mono); font-size:11.5px; color:var(--muted); line-height:1.8; margin-top:12px}
.pmeta b{color:var(--ink)}
.tgt{display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px}
.tgt .fld{margin-bottom:0; min-width:150px}
button.act{font-family:var(--mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; color:var(--ground); background:var(--ink); border:0; border-radius:2px;
  padding:9px 14px; cursor:pointer}
button.act.ghost{background:transparent; color:var(--ink2); border:1px solid var(--rule2)}
button.act:hover{background:var(--brass); color:#fff}
button.act.ghost:hover{color:#fff}
.boardwrap{background:var(--raised); border:1px solid var(--rule); border-radius:3px}
.boardhead{display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:13px 16px; border-bottom:1px solid var(--rule)}
.tabs{display:inline-flex; border:1px solid var(--rule2); border-radius:2px; overflow:hidden}
.tabs button{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  font-weight:700; padding:6px 13px; border:0; border-right:1px solid var(--rule2); background:transparent;
  color:var(--muted); cursor:pointer}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--brass); color:#fff}
.boardbody{padding:14px 16px 16px; overflow-x:auto}
.pcell{position:relative; min-width:120px}
.pbar{position:absolute; left:0; top:3px; bottom:3px; background:var(--brass); opacity:.22; border-radius:2px}
.pcell span{position:relative}

/* ============================================================ verdict */
.verdict{border:1px solid var(--rule); border-radius:3px; overflow:hidden; margin:26px 0 0; background:var(--surface)}
.vr{display:grid; grid-template-columns:220px 1fr; border-bottom:1px solid var(--rule)}
.vr:last-child{border-bottom:0}
.vr .vq{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
        color:var(--muted); font-weight:700; padding:15px 17px; border-right:1px solid var(--rule)}
.vr .va{padding:15px 17px; font-size:15.5px; line-height:1.55}
.vr .va b{color:var(--brass)}
@media(max-width:700px){.vr{grid-template-columns:1fr} .vr .vq{border-right:0; border-bottom:1px solid var(--rule); padding-bottom:0}}

#tip{position:fixed; z-index:60; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--ink); color:var(--ground); font-family:var(--mono); font-size:11px; line-height:1.55;
  padding:7px 10px; border-radius:3px; max-width:250px; box-shadow:var(--shadow)}
#tip b{font-weight:700}

footer{margin-top:56px; padding-top:22px; border-top:1px solid var(--rule);
       font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.85}

@media(max-width:820px){
  .seg{grid-template-columns:1fr; gap:0}
  .cue{position:static; display:flex; gap:14px; align-items:baseline; flex-wrap:wrap; margin-bottom:14px}
  .cue .n{font-size:2rem}
  .cue .d{border-top:0; padding-top:0; margin-top:0; flex:1 1 100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}

/* ============================================================ separability companions (Fig 7-10) */
.sepblock{margin:0 0 20px}
.sepblock:last-child{margin-bottom:4px}
.sephead{display:flex; align-items:baseline; gap:8px 14px; flex-wrap:wrap; margin:0 0 6px}
.sephead b{font-family:var(--display); font-size:1.04rem; letter-spacing:-.005em}
.sephead .pick{font-family:var(--mono); font-size:10px; letter-spacing:.12em;
               text-transform:uppercase; color:var(--muted); font-weight:600}
svg.sep{width:100%; display:block; overflow:visible; min-width:0}
svg.sep text{font-family:var(--mono); font-size:11px; fill:var(--ink2)}
svg.sep text.dim{fill:var(--muted); font-size:10px}
svg.sep text.key{fill:var(--ink); font-weight:700}
svg.sep text.hd{fill:var(--muted); font-size:9.5px; letter-spacing:.1em}
.sepscroll{overflow-x:auto; min-width:0}
.sepscroll > div{min-width:640px}
.ladders{display:grid; gap:16px 24px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.ladder{min-width:0}
.ladhead{display:flex; align-items:baseline; gap:7px 12px; flex-wrap:wrap; margin:0 0 5px}
.ladhead b{font-family:var(--display); font-size:1rem}
.ladhead span{font-family:var(--mono); font-size:10px; letter-spacing:.1em;
              text-transform:uppercase; color:var(--muted); font-weight:600}
.ladhead span.warn{color:var(--warn)}
.ladhead span.ok{color:var(--good)}

function drawHeat(){

    html+=`<tr><th class="tm">${team}</th>`;

          +'" data-w="'+s.players[i]+'">'+v.toFixed(2)+'</td>';

/* ============================================================ CALCULATOR */
const ROLES=["Core","Mid","Support"];
const D2 = JSON.parse(document.getElementById("calcdata2").textContent);

/* Two contest stages, two datasets.
   Stage 1 (Group stage): 16 teams, 3 emblems per banner, ladders built on the
     548-day run-up as published before the event.
   Stage 2 (TI stage): the 8 teams left in the bracket, 5 emblems per banner
     (rules sheet "Distribution (Stage 2)" -- the first three carry over from
     stage 1 and two are added), ladders rebuilt on a pool that now contains the
     109 TI 2026 games already played and is scored on the calibration read off
     Valve's own fantasy fields in the replays. */
const STAGES={
  1:{data:D, label:"1 · Group stage",
     slots:{Core:["Red","Green","Red"],Mid:["Red","Blue","Green"],Support:["Blue","Green","Blue"]},
     seriesOpts:[2,3,4,5,6], seriesDef:5, keep:1,
     defaults:{
       Core:{team:"LGD Gaming",stats:["creep_score","teamfight_participation","gpm"]},
       Mid:{team:"Team Liquid",stats:["creep_score","runes_grabbed","teamfight_participation"]},
       Support:{team:"LGD Gaming",stats:["watchers_taken","teamfight_participation","obs_placed"]}
     },
     note:"16 teams · 3 emblems · Swiss, 2–6 Bo3 series · pre-event run-up only"},
  2:{data:D2, label:"2 · TI stage",
     slots:D2.slots,
     seriesOpts:[2,3,4,5,6], seriesDef:3, keep:1,
     defaults:{
       Core:{team:D2.roles.Core.teams[0],stats:D2.roles.Core.picks.slice()},
       Mid:{team:D2.roles.Mid.teams[0],stats:D2.roles.Mid.picks.slice()},
       Support:{team:D2.roles.Support.teams[0],stats:D2.roles.Support.picks.slice()}
     },
     note:"8 teams left · 5 emblems · bracket, 2–6 Bo3 series · run-up + the 109 TI games played"}
};
let stage=2;                       /* stage 2 is the live one */
let D_ = STAGES[stage].data;
let SLOTS = STAGES[stage].slots;
let LEV = D_.levels.map(v=>v/100);
/* Payout: the best 2 games of each series, then the best series (§16). Series
   length is drawn per series: 2-0 or 2-1, with P(2-1)=0.407, the observed TI
   rate (§19) -- which reproduces §16's simulated 2.42 games per series. The
   stage-2 payout rule is assumed to be the group stage's; Valve has not
   published a different one. */
let SERIES_OPTS=STAGES[stage].seriesOpts, SERIES_DEF=STAGES[stage].seriesDef, KEEP_SERIES=STAGES[stage].keep;
const P_THIRD=0.407;
const state={};
function resetState(){
  const cfg=STAGES[stage];
  ROLES.forEach(r=>state[r]={team:cfg.defaults[r].team,stats:cfg.defaults[r].stats.slice(),
    mult:cfg.slots[r].map(()=>100),series:cfg.seriesDef});
}
resetState();

function statsFor(role,colour){ return D_.roles[role].stats.filter(s=>s.c===colour); }
function label(role,key){ const s=D_.roles[role].stats.find(x=>x.k===key); return s?s.l:key; }

      /* stage 2 keeps your first three stage-1 emblems and adds two */

    b.appendChild(sub);
    host.appendChild(b);

/* --- maths ------------------------------------------------------------ */
function normCdf(z){
  const t=1/(1+0.2316419*Math.abs(z));
  const d=0.3989422804014327*Math.exp(-z*z/2);
  let p=d*t*(0.319381530+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
  return z>0 ? 1-p : p;
}
/* Cholesky of an n x n correlation matrix; n is 3 in stage 1 and 5 in stage 2. */
function cholN(P){
  const n=P.length;
  const L=Array.from({length:n},()=>new Array(n).fill(0));
  for(let i=0;i<n;i++) for(let j=0;j<=i;j++){
    let s=P[i][j];
    for(let k=0;k<j;k++) s-=L[i][k]*L[j][k];
    if(i===j) L[i][j]=Math.sqrt(Math.max(s,1e-8)); else L[i][j]=s/L[j][j];
  }
  return L;
}
function corrFor(role,keys){
  const gc=D_.gcorr[role], n=keys.length;
  const idx=keys.map(k=>gc.stats.indexOf(k));
  const P=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?1:0));
  for(let i=0;i<n;i++) for(let j=0;j<n;j++){
    if(i===j) continue;
    /* the same emblem twice on one banner cannot happen (one stat per banner),
       but guard anyway: identical keys are perfectly coupled */
    if(keys[i]===keys[j]){ P[i][j]=0.98; continue; }
    let rs = (idx[i]>=0&&idx[j]>=0) ? gc.m[idx[i]][idx[j]] : 0;
    let p = 2*Math.sin(Math.PI*rs/6);
    P[i][j]=Math.max(-0.98,Math.min(0.98,p));
  }
  return cholN(P);
}
function ladderOf(role,key,team){
  const c=D_.roles[role].cells[key];
  return c && c[team] ? c[team] : null;
}
function invLadder(q,u){
  if(u<=LEV[0]) return q[0];
  const n=LEV.length;
  if(u>=LEV[n-1]) return q[n-1];
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1; if(LEV[m]<=u) lo=m; else hi=m;}
  const w=(u-LEV[lo])/(LEV[hi]-LEV[lo]);
  return q[lo]+w*(q[hi]-q[lo]);
}
let seed=20260809;
function rnd(){ seed=(seed*1664525+1013904223)>>>0; return (seed+0.5)/4294967296; }
function gauss(){
  const u1=rnd(), u2=rnd();
  return Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
}
/* one game for one banner: every emblem on it drawn together, so a good farming
   game produces a good creep score and a good GPM at the same time */
function drawGame(L,lads,mults){
  const n=L.length, z=new Array(n);
  for(let i=0;i<n;i++) z[i]=gauss();
  let tot=0;
  for(let i=0;i<n;i++){
    let x=0; for(let k2=0;k2<=i;k2++) x+=L[i][k2]*z[k2];
    const u=normCdf(x);
    if(lads[i]) tot += invLadder(lads[i],u)*mults[i]/100;
  }
  return tot;
}
/* simulate n stages of `nser` Bo3 series for one banner; returns array of
   stage payouts: best 2 games of each series, best KEEP_SERIES series */
function simBanner(role,team,keys,mults,n,nser){
  const L=corrFor(role,keys);
  const lads=keys.map(k=>{const c=ladderOf(role,k,team); return c?c.q:null;});
  const ns=nser||SERIES_DEF;
  const out=new Float64Array(n);
  const ser=new Array(ns), gm=new Array(3);   /* 3 = max games in a Bo3 */
  for(let s=0;s<n;s++){
    for(let j=0;j<ns;j++){
      const ng = rnd()<P_THIRD ? 3 : 2;
      for(let g=0;g<ng;g++) gm[g]=drawGame(L,lads,mults);
      let v=0;
      if(ng===2) v=gm[0]+gm[1];
      else v=gm[0]+gm[1]+gm[2]-Math.min(gm[0],gm[1],gm[2]); /* best 2 of 3 */
      ser[j]=v;
    }
    ser.sort((a,b)=>b-a);
    let tot=0; for(let j=0;j<KEEP_SERIES&&j<ns;j++) tot+=ser[j];
    out[s]=tot;
  }
  return out;
}
function quant(sorted,p){
  const i=(sorted.length-1)*p, lo=Math.floor(i), hi=Math.ceil(i);
  return sorted[lo]+(i-lo)*(sorted[hi]-sorted[lo]);
}
function mean(a){let s=0; for(let i=0;i<a.length;i++)s+=a[i]; return s/a.length;}

/* --- run -------------------------------------------------------------- */
const N=20000;
let firstRun=true;
function run(){
  seed=20260809;
  const per={}, sorted={};
  ROLES.forEach(r=>{
    per[r]=simBanner(r,state[r].team,state[r].stats,state[r].mult,N,state[r].series);
    const c=Array.from(per[r]).sort((a,b)=>a-b); sorted[r]=c;
    const sub=document.getElementById("sub-"+r);
    const eff=state[r].stats.map(k=>{const c2=ladderOf(r,k,state[r].team); return c2?c2.e:0;});
    sub.innerHTML=`expected <b>${fmt(mean(per[r]))}</b> over ${state[r].series} series, best 2 kept`+
      `<br>p10 ${fmt(quant(c,0.10))} &nbsp; p50 ${fmt(quant(c,0.50))} &nbsp; p90 ${fmt(quant(c,0.90))}`+
      `<br>${stage===2?"weighted games behind it":"run-up games behind it"}: ${Math.min(...eff)}`;
  });
  const tot=new Float64Array(N);
  for(let i=0;i<N;i++) tot[i]=per.Core[i]+per.Mid[i]+per.Support[i];
  const st=Array.from(tot).sort((a,b)=>a-b);
  const m=mean(tot);
  const tgtEl=document.getElementById("target");
  if(firstRun){ tgtEl.value=Math.round(quant(st,0.5)/500)*500; firstRun=false; }
  const target=parseFloat(tgtEl.value)||0;
  let hits=0; for(let i=0;i<N;i++) if(tot[i]>=target) hits++;
  const p=100*hits/N;
  document.getElementById("pOut").innerHTML=p.toFixed(1)+"<small>%</small>";
  document.getElementById("pMeta").innerHTML=
    `chance of clearing <b>${fmt(target)}</b><br>`+
    `expected total <b>${fmt(m)}</b><br>`+
    `p10 <b>${fmt(quant(st,0.10))}</b> &nbsp; median <b>${fmt(quant(st,0.50))}</b> &nbsp; p90 <b>${fmt(quant(st,0.90))}</b><br>`+
    `${ROLES.map(r=>r+" "+state[r].series).join(" &nbsp; ")} series &nbsp;&middot;&nbsp; best 2 games of each, best ${KEEP_SERIES===1?"":KEEP_SERIES+" "}series kept<br>`+
    `typical kept series: ${fmt(quant(st,0.5)/(KEEP_SERIES*2*ROLES.length))} per banner-series`;
  drawHist(st,target,m);
  drawBoard();
}

function drawHist(sorted,target,m){
  const svg=document.getElementById("hist"); svg.innerHTML="";
  const W=Math.max(320,svg.clientWidth||520), H=210, L=8,R=8,T=14,B=30;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("height",H);
  const lo=sorted[Math.floor(sorted.length*0.002)], hi=sorted[Math.floor(sorted.length*0.998)];
  const nb=52, bins=new Array(nb).fill(0);
  for(let i=0;i<sorted.length;i++){
    let b=Math.floor((sorted[i]-lo)/(hi-lo)*nb); if(b<0)b=0; if(b>=nb)b=nb-1; bins[b]++;
  }
  const mx=Math.max(...bins);
  const X=v=>L+(v-lo)/(hi-lo)*(W-L-R);
  const bw=(W-L-R)/nb;
  bins.forEach((c,i)=>{
    const x=L+i*bw, h=(c/mx)*(H-T-B);
    const centre=lo+(i+0.5)*(hi-lo)/nb;
    el("rect",{x:x,y:H-B-h,width:Math.max(1,bw-1),height:h,
      fill: centre>=target ? cv("--brass") : cv("--rule2"),
      opacity: centre>=target ? 0.9 : 0.55},svg);
  });
  el("line",{x1:L,x2:W-R,y1:H-B,y2:H-B,class:"ax"},svg);
  el("line",{x1:X(m),x2:X(m),y1:T-6,y2:H-B,stroke:cv("--ink"),"stroke-width":1.5,"stroke-dasharray":"4 4"},svg);
  if(target>lo&&target<hi){
    el("line",{x1:X(target),x2:X(target),y1:T-6,y2:H-B,stroke:cv("--brass"),"stroke-width":2},svg);
    el("text",{x:X(target),y:T-1,"text-anchor":"middle",fill:cv("--brass")},svg).textContent="target";
  }
  [0,0.25,0.5,0.75,1].forEach(f=>{
    const v=lo+f*(hi-lo);
    el("text",{x:X(v),y:H-10,"text-anchor": f===0?"start":(f===1?"end":"middle")},svg).textContent=fmt(v);
  });
}

let boardRole="Support";
function buildBoardTabs(){
  const tabs=document.getElementById("boardTabs"); tabs.innerHTML="";
  ROLES.forEach(r=>{
    const b=document.createElement("button"); b.textContent=r;
    b.setAttribute("aria-pressed", r===boardRole?"true":"false");
    b.addEventListener("click",()=>{boardRole=r; [...tabs.children].forEach(c=>c.setAttribute("aria-pressed",c.textContent===r?"true":"false")); drawBoard();});
    tabs.appendChild(b);
  });
}
function drawBoard(){
  const role=boardRole, st=state[role];
  document.getElementById("boardCtx").textContent =
    st.stats.map((k,i)=>label(role,k)+(st.mult[i]!==100?" @"+st.mult[i]+"%":"")).join("  +  ")
    + "   ·   " + st.series + " series";
  const rows=D_.roles[role].teams.map(team=>{
    const s=simBanner(role,team,st.stats,st.mult,6000,st.series);
    const c=Array.from(s).sort((a,b)=>a-b);
    return {team, m:mean(s), p10:quant(c,0.10), p50:quant(c,0.50), p90:quant(c,0.90),
            eff:Math.min(...st.stats.map(k=>{const q=ladderOf(role,k,team); return q?q.e:0;}))};
  }).sort((a,b)=>b.m-a.m);
  const mx=Math.max(...rows.map(r=>r.m)), mn=Math.min(...rows.map(r=>r.m));
  let h=`<thead><tr><th>#</th><th>Team</th><th class="l">Expected stage payout, ${st.series} series</th><th>p10</th><th>p50</th><th>p90</th><th>vs your pick</th><th>${stage===2?"Weighted games":"Run-up games"}</th></tr></thead><tbody>`;
  const mine=rows.find(r=>r.team===st.team);
  rows.forEach((r,i)=>{
    const w=100*(r.m-mn*0.94)/(mx-mn*0.94);
    const d=r.m-mine.m;
    h+=`<tr class="${r.team===st.team?"hl":""}"><td class="n">${i+1}</td><td>${r.team}</td>`+
       `<td class="n pcell"><div class="pbar" style="width:${w}%"></div><span>${fmt(r.m)}</span></td>`+
       `<td class="n">${fmt(r.p10)}</td><td class="n">${fmt(r.p50)}</td><td class="n">${fmt(r.p90)}</td>`+
       `<td class="n" style="color:${d>0?cv("--good"):(d<0?cv("--muted"):cv("--ink"))}">${d===0?"&middot;":(d>0?"+":"")+fmt(d)}</td>`+
       `<td class="n" style="color:${r.eff<40?cv("--bad"):cv("--muted")}">${r.eff}</td></tr>`;
  });
  document.getElementById("boardTable").innerHTML=h+"</tbody>";
}

document.getElementById("run").addEventListener("click",run);
document.getElementById("target").addEventListener("change",run);
document.getElementById("reset").addEventListener("click",()=>{
  resetState(); firstRun=true; buildBanks(); run();
});

/* --- stage switch ----------------------------------------------------- */
function applyStage(s){
  stage=s;
  const cfg=STAGES[stage];
  D_=cfg.data; SLOTS=cfg.slots; LEV=D_.levels.map(v=>v/100);
  SERIES_OPTS=cfg.seriesOpts; SERIES_DEF=cfg.seriesDef; KEEP_SERIES=cfg.keep;
  document.getElementById("stageNote").textContent=cfg.note;
  resetState(); firstRun=true; buildBanks(); run();
}
function buildStageTabs(){
  const tabs=document.getElementById("stageTabs"); tabs.innerHTML="";
  [1,2].forEach(s=>{
    const b=document.createElement("button"); b.textContent=STAGES[s].label;
    b.setAttribute("aria-pressed", s===stage?"true":"false");
    b.addEventListener("click",()=>{
      [...tabs.children].forEach((c,i)=>c.setAttribute("aria-pressed",(i+1)===s?"true":"false"));
      applyStage(s);
    });
    tabs.appendChild(b);
  });
  document.getElementById("stageNote").textContent=STAGES[stage].note;
}
buildStageTabs(); buildBanks(); buildBoardTabs(); run();
